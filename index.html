            useEffect(() => {
                let stream = null;
                let rafId = null;
                let stopped = false;

                if (!('BarcodeDetector' in window)) {
                    setError('您的瀏覽器不支援掃碼功能，請手動從清單選擇');
                    return;
                }

                const detector = new window.BarcodeDetector({ formats: ['code_128'] });

                navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                    .then((s) => {
                        stream = s;
                        if (videoRef.current) {
                            videoRef.current.srcObject = s;
                            videoRef.current.play();
                        }
                        const tick = async () => {
                            if (stopped || !videoRef.current) return;
                            try {
                                const codes = await detector.detect(videoRef.current);
                                if (codes.length > 0) {
                                    const value = codes[0].rawValue;
                                    const match = containers.find(c => c.shortCode === value);
                                    if (match) {
                                        stopped = true;
                                        onDetect(match.id);
                                        return;
                                    }
                                }
                            } catch (e) { /* 偵測失敗時忽略，繼續下一輪 */ }
                            rafId = requestAnimationFrame(tick);
                        };
                        rafId = requestAnimationFrame(tick);
                    })
                    .catch(() => setError('無法開啟相機，請確認已允許相機權限'));

                return () => {
                    stopped = true;
                    if (rafId) cancelAnimationFrame(rafId);
                    if (stream) stream.getTracks().forEach(t => t.stop());
                };
            }, []);

            return (
                <div className="fixed inset-0 bg-black z-[70] flex flex-col items-center justify-center">
                    <button onClick={onClose} className="absolute top-4 right-4 p-2 bg-white/20 rounded-full text-white z-10"><Icon name="X" size={20}/></button>
                    {error ? (
                        <div className="text-white text-center px-8">
                            <Icon name="CameraOff" size={40} className="mx-auto mb-3 opacity-60"/>
                            <p className="text-sm opacity-80">{error}</p>
                        </div>
                    ) : (
                        <>
                            <video ref={videoRef} className="w-full h-full object-cover" muted playsInline></video>
                            <div className="absolute inset-x-8 top-1/2 -translate-y-1/2 h-24 border-2 border-white/70 rounded-xl"></div>
                            <p className="absolute bottom-10 text-white text-sm bg-black/40 px-4 py-2 rounded-full">將容器上的條碼對準框內</p>
                        </>
                    )}
                </div>
            );
        };


        const ContainerDetail = ({ selectedContainer, categories, setSelectedContainer, setShowEditContainer, handleDeleteContainer, setViewingItemData, toggleFavorite, setShowItemForm, setEditingItemData }) => {
            if (!selectedContainer) return null;
            const sortedItems = [...selectedContainer.items].sort((a, b) => (b.isFavorite === true) - (a.isFavorite === true));

            return (
            <div className="h-full flex flex-col bg-white min-h-screen">
                <div className="sticky top-0 z-10 bg-white/80 backdrop-blur-md px-4 py-3 flex items-center justify-between border-b border-gray-100">
                    <div className="flex items-center gap-2 overflow-hidden">
                        <button onClick={() => setSelectedContainer(null)} className="p-2 -ml-2 text-gray-700 hover:bg-gray-100 rounded-full"><Icon name="ChevronRight" className="rotate-180" size={24} /></button>
                        <span className="font-bold text-gray-800 truncate">{selectedContainer.name}</span>
                    </div>
                    {/* 未存放容器不顯示編輯/刪除按鈕 */}
                    {selectedContainer.id !== 'unsorted' && (
                        <div className="flex items-center">
                            <button onClick={() => setShowEditContainer(true)} className="p-2 text-gray-400 hover:text-indigo-600 rounded-full hover:bg-indigo-50"><Icon name="Edit3" size={20} /></button>
                            <button onClick={() => handleDeleteContainer(selectedContainer.id)} className="p-2 -mr-2 text-gray-400 hover:text-red-500 rounded-full hover:bg-red-50"><Icon name="Trash2" size={20} /></button>
                        </div>
                    )}
                </div>
                <div className="flex-1 px-4 py-6 overflow-y-auto pb-32 no-scrollbar">
                    {selectedContainer.id !== 'unsorted' && (
                        <>
                            <div className="grid grid-cols-2 gap-3 mb-6">
                                <div className="aspect-square rounded-2xl bg-gray-100 overflow-hidden relative shadow-sm border border-gray-100">
                                    {selectedContainer.image ? <img src={selectedContainer.image} className="w-full h-full object-cover"/> : <div className="w-full h-full flex flex-col items-center justify-center text-gray-400"><Icon name="Box" size={32}/><span className="text-xs mt-1">無外觀圖</span></div>}
                                    <div className="absolute bottom-2 left-2 bg-black/50 text-white text-[10px] px-2 py-0.5 rounded">外觀</div>
                                </div>
                                <div className="aspect-square rounded-2xl bg-gray-100 overflow-hidden relative shadow-sm border border-gray-100">
                                    {selectedContainer.locationImage ? <img src={selectedContainer.locationImage} className="w-full h-full object-cover"/> : <div className="w-full h-full flex flex-col items-center justify-center text-gray-400"><Icon name="Map" size={32}/><span className="text-xs mt-1">無位置圖</span></div>}
                                    <div className="absolute bottom-2 left-2 bg-black/50 text-white text-[10px] px-2 py-0.5 rounded">位置</div>
                                </div>
                            </div>
                            <div className="mb-6">
                                <h1 className="text-xl font-bold text-gray-900 leading-tight mb-2">{selectedContainer.name}</h1>
                                <div className="flex items-center gap-1 text-gray-500 font-medium text-sm bg-gray-100 inline-flex px-2 py-1 rounded-lg"><Icon name="MapPin" size={14} /> {selectedContainer.location}</div>
                            </div>
                            {selectedContainer.details && (
                                <div className="mb-6">
                                    <h4 className="text-xs font-bold text-indigo-400 uppercase mb-2 flex items-center gap-1"><Icon name="EyeOff" size={10}/> 詳情</h4>
                                    <div className="p-3 bg-indigo-50/50 rounded-xl border border-indigo-100 text-sm text-gray-700 whitespace-pre-wrap">{selectedContainer.details}</div>
                                </div>
                            )}
                        </>
                    )}
                    <div className="space-y-3 mt-6">
                        <h4 className="text-xs font-bold text-gray-400 uppercase mb-2">物品清單</h4>
                        {sortedItems.map((item) => (
                            <ItemRow key={item.id} item={item} containerName={null} categories={categories} onClick={() => setViewingItemData({...item, containerId: selectedContainer.id})} showTimeLabel={item.hasExpiry} onToggleFavorite={toggleFavorite} />
                        ))}
                        {selectedContainer.items.length === 0 && <div className="text-center py-10 text-gray-400 text-sm">此容器是空的</div>}
                    </div>
                    {selectedContainer.id !== 'unsorted' && (
                        <div className="mt-6">
                            <h4 className="text-xs font-bold text-gray-400 uppercase mb-2 flex items-center gap-1"><Icon name="ScanLine" size={10}/> 容器條碼</h4>
                            <BarcodeLabel value={selectedContainer.shortCode} name={selectedContainer.name} />
                        </div>
                    )}
                </div>
                <div className="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-white via-white to-transparent md:max-w-md md:mx-auto">
                    <button onClick={() => { setEditingItemData(null); setShowItemForm(true); }} className="w-full bg-indigo-600 text-white py-3.5 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 hover:scale-[1.02] transition-transform"><Icon name="Plus" size={20} /> 放入物品</button>
                </div>
            </div>
            );
        };

        const ItemPickerModal = ({ containers, categories, onSelect, onClose }) => {
            const [term, setTerm] = useState('');
            const allItems = [];
            containers.forEach(c => c.items.forEach(i => {
                allItems.push({ ...i, containerId: c.id, containerName: c.id === 'unsorted' ? '未存放' : c.name });
            }));
            const filtered = term.trim() ? allItems.filter(i => i.name.toLowerCase().includes(term.toLowerCase())) : allItems;

            return (
                <div className="fixed inset-0 bg-black/60 z-[60] flex items-end md:items-center justify-center p-0 md:p-4">
                    <div className="bg-white rounded-t-3xl md:rounded-2xl w-full max-w-md shadow-2xl flex flex-col max-h-[85vh]">
                        <div className="flex justify-between items-center p-4 border-b border-gray-100 flex-shrink-0">
                            <h3 className="text-lg font-bold text-gray-800">選擇物品</h3>
                            <button onClick={onClose} className="p-2 bg-gray-100 rounded-full"><Icon name="X" size={18} className="text-gray-500" /></button>
                        </div>
                        <div className="p-4 pb-2 flex-shrink-0">
                            <input value={term} onChange={e => setTerm(e.target.value)} autoFocus placeholder="搜尋物品名稱" className="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                        </div>
                        <div className="flex-1 overflow-y-auto no-scrollbar px-4 pb-4 space-y-2">
                            {filtered.map(item => (
                                <div key={item.id} onClick={() => onSelect(item)} className="p-3 bg-gray-50 rounded-xl flex items-center gap-3 cursor-pointer active:bg-gray-100">
                                    <div className="w-10 h-10 rounded-lg bg-white border border-gray-100 flex-shrink-0 overflow-hidden flex items-center justify-center">
                                        {item.image ? <img src={item.image} className="w-full h-full object-cover"/> : <Icon name={categories[(item.categories||[item.category])[0]]?.iconName || 'Package'} size={16} className="text-gray-400"/>}
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <div className="font-bold text-sm text-gray-800 truncate">{item.name}</div>
                                        <div className="text-[10px] text-gray-400 flex items-center gap-1"><Icon name="Box" size={10}/> {item.containerName}</div>
                                    </div>
                                </div>
                            ))}
                            {filtered.length === 0 && <div className="text-center text-gray-400 text-sm py-10">找不到符合的物品</div>}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [containers, setContainers] = useState(() => { try { return JSON.parse(localStorage.getItem('storage_app_promax_data') || '[]'); } catch (e) { return []; } });
            const [categories, setCategories] = useState(() => { try { return JSON.parse(localStorage.getItem('storage_app_promax_cats') || JSON.stringify(DEFAULT_CATEGORIES)); } catch (e) { return DEFAULT_CATEGORIES; } });
            const [shoppingExtra, setShoppingExtra] = useState(() => { try { return JSON.parse(localStorage.getItem('storage_app_promax_shopping') || '[]'); } catch (e) { return []; } });
            const [packingLists, setPackingLists] = useState(() => { try { return JSON.parse(localStorage.getItem('storage_app_promax_packing') || '[]'); } catch (e) { return []; } });
            const [activeTab, setActiveTab] = useState('browse');
            const [selectedContainer, setSelectedContainer] = useState(null);
            const [activeCategory, setActiveCategory] = useState(null);
            const [browseMode, setBrowseMode] = useState('container');
            const [reminderSubView, setReminderSubView] = useState('time');
            const [listsSubView, setListsSubView] = useState('favorites');
            const [showShoppingNewForm, setShowShoppingNewForm] = useState(false);
            const [showPackingCustomInput, setShowPackingCustomInput] = useState(false);
            const [showPackingNewListForm, setShowPackingNewListForm] = useState(false);
            const [nextContainerCode, setNextContainerCode] = useState(() => { try { return Number(localStorage.getItem('storage_app_promax_code_counter') || '1'); } catch (e) { return 1; } });
            const [activePackingListId, setActivePackingListId] = useState(null);
            const [showItemPicker, setShowItemPicker] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const [showExpiredView, setShowExpiredView] = useState(false);
            const [isLoaded, setIsLoaded] = useState(false);
            
            const [showAddContainer, setShowAddContainer] = useState(false);
            const [showEditContainer, setShowEditContainer] = useState(false);
            const [showItemForm, setShowItemForm] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            const [editingItemData, setEditingItemData] = useState(null);
            const [viewingItemData, setViewingItemData] = useState(null);
            const [undoToast, setUndoToast] = useState(null);
            const [infoToast, setInfoToast] = useState(null);
            const showInfoToast = (msg) => {
                setInfoToast(msg);
                setTimeout(() => setInfoToast(null), 2500);
            };

            useEffect(() => {
                try {
                    const storedContainers = JSON.parse(localStorage.getItem('storage_app_promax_data') || '[]');
                    const storedCategories = JSON.parse(localStorage.getItem('storage_app_promax_cats') || JSON.stringify(DEFAULT_CATEGORIES));
                    const storedShopping = JSON.parse(localStorage.getItem('storage_app_promax_shopping') || '[]');
                    const storedPacking = JSON.parse(localStorage.getItem('storage_app_promax_packing') || '[]');

                    // 補齊舊容器缺少的短編號（條碼用）
                    let codeCounter = Number(localStorage.getItem('storage_app_promax_code_counter') || '1');
                    const backfilledContainers = storedContainers.map(c => {
                        if (c.id === 'unsorted' || c.shortCode) return c;
                        const code = String(codeCounter).padStart(6, '0');
                        codeCounter++;
                        return { ...c, shortCode: code };
                    });
                    if (codeCounter !== Number(localStorage.getItem('storage_app_promax_code_counter') || '1')) {
                        localStorage.setItem('storage_app_promax_code_counter', String(codeCounter));
                        setNextContainerCode(codeCounter);
                    }

                    setContainers(backfilledContainers);
                    setCategories(storedCategories);
                    setShoppingExtra(storedShopping);
                    setPackingLists(storedPacking);
                } catch (e) {
                    console.error("Failed to load data", e);
                } finally {
                    setIsLoaded(true);
                }
            }, []);

            // Debounced save to avoid freezing UI
            useEffect(() => { 
                if (!isLoaded) return;
                const timer = setTimeout(() => {
                    try {
                        localStorage.setItem('storage_app_promax_data', JSON.stringify(containers)); 
                    } catch (e) {
                        if (e.name === 'QuotaExceededError') alert("⚠️ 警告：儲存空間已滿！圖片過多可能導致資料丟失。請刪除部分圖片或進行備份。");
                    }
                }, 500); // 500ms delay
                return () => clearTimeout(timer);
            }, [containers, isLoaded]);
            
            useEffect(() => { 
                if (!isLoaded) return;
                localStorage.setItem('storage_app_promax_cats', JSON.stringify(categories)); 
            }, [categories, isLoaded]);

            useEffect(() => {
                if (!isLoaded) return;
                localStorage.setItem('storage_app_promax_shopping', JSON.stringify(shoppingExtra));
            }, [shoppingExtra, isLoaded]);

            useEffect(() => {
                if (!isLoaded) return;
                localStorage.setItem('storage_app_promax_packing', JSON.stringify(packingLists));
            }, [packingLists, isLoaded]);

            const handleExport = () => {
                const data = { containers, categories, exportDate: new Date().toISOString(), version: "6.7" };
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `收納管家備份_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            };

            const handleImport = (file) => {
                alert("正在讀取備份檔案，請稍候...");
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.containers && data.categories) { 
                            if(confirm("即將覆蓋當前所有資料，確定嗎？")) {
                                setContainers(data.containers); setCategories(data.categories); alert("資料還原成功！"); setShowSettings(false); 
                            }
                        } else { alert("無效的備份檔案格式。"); }
                    } catch (err) { alert("讀取檔案失敗。"); }
                };
                reader.readAsText(file);
            };

            // 復原提示計時器
            const undoTimerRef = useRef(null);
            const showUndoToast = (label, restoreFn) => {
                if (undoTimerRef.current) clearTimeout(undoTimerRef.current.timer);
                const timer = setTimeout(() => setUndoToast(null), 5000);
                undoTimerRef.current = { timer };
                setUndoToast({ label, restoreFn });
            };
            const handleUndo = () => {
                if (undoTimerRef.current) clearTimeout(undoTimerRef.current.timer);
                if (undoToast) undoToast.restoreFn();
                setUndoToast(null);
            };

            // 全局強力刪除
            const handleDeleteItem = (containerId, itemId) => {
                // 增加防呆：如果沒有 itemId，嘗試從 editingItemData 獲取
                const targetId = itemId || editingItemData?.id;
                
                if (!targetId) {
                    alert("錯誤：找不到物品ID，無法刪除");
                    return;
                }

                let removedItem = null, removedFromId = null;
                containers.forEach(c => { const found = c.items.find(i => i.id === targetId); if (found) { removedItem = found; removedFromId = c.id; } });

                // 直接刪除，不需要確認，可在稍後復原
                const updated = containers.map(c => ({
                    ...c,
                    items: c.items.filter(i => i.id !== targetId)
                }));
                
                setContainers(updated);
                
                // 更新當前選中的容器視圖 (如果有的話)
                if (selectedContainer) {
                     const updatedSelected = updated.find(c => c.id === selectedContainer.id);
                     setSelectedContainer(updatedSelected);
                }
                
                // 關閉所有相關彈窗
                setViewingItemData(null);
                setEditingItemData(null);
                setShowItemForm(false);

                if (removedItem && removedFromId) {
                    showUndoToast(`已刪除「${removedItem.name}」`, () => {
                        setContainers(prev => prev.map(c => c.id === removedFromId ? { ...c, items: [...c.items, removedItem] } : c));
                    });
                }
            };

            const handleSaveContainer = (data) => {
                if (showEditContainer && selectedContainer) {
                    setContainers(prev => prev.map(c => c.id === selectedContainer.id ? { ...c, ...data } : c));
                    setSelectedContainer(prev => ({ ...prev, ...data }));
                    setShowEditContainer(false);
                } else {
                    const code = String(nextContainerCode).padStart(6, '0');
                    const newContainer = { id: Date.now().toString(), shortCode: code, items: [], ...data };
                    setContainers(prev => [...prev, newContainer]);
                    setNextContainerCode(prev => {
                        const next = prev + 1;
                        try { localStorage.setItem('storage_app_promax_code_counter', String(next)); } catch (e) {}
                        return next;
                    });
                    setShowAddContainer(false);
                }
            };

            const handleSaveItem = (itemData, targetContainerId) => {
                if (editingItemData) {
                    const originalContainerId = editingItemData.containerId;
                    const itemId = editingItemData.id;
                    let newContainers = [...containers];
                    if (originalContainerId !== targetContainerId) {
                        newContainers = newContainers.map(c => c.id === originalContainerId ? { ...c, items: c.items.filter(i => i.id !== itemId) } : c);
                        if (targetContainerId === 'unsorted' && !newContainers.find(c => c.id === 'unsorted')) {
                            newContainers.push({ id: 'unsorted', name: '未存放', location: '待整理', items: [] });
                        }
                        newContainers = newContainers.map(c => c.id === targetContainerId ? { ...c, items: [...c.items, { ...itemData, id: itemId }] } : c);
                    } else {
                        newContainers = newContainers.map(c => c.id === originalContainerId ? { ...c, items: c.items.map(i => i.id === itemId ? { ...itemData, id: itemId } : i) } : c);
                    }
                    setContainers(newContainers);
                    if (selectedContainer) {
                        if (selectedContainer.id === originalContainerId || selectedContainer.id === targetContainerId) {
                            setSelectedContainer(newContainers.find(c => c.id === selectedContainer.id));
                        }
                    }
                    if (viewingItemData && viewingItemData.id === itemId) {
                        setViewingItemData({ ...itemData, id: itemId, containerId: targetContainerId });
                    }
                } else {
                    const newItem = { ...itemData, id: Date.now().toString(), isFavorite: itemData.isFavorite || false, supplementaryImages: itemData.supplementaryImages || [] };
                    let newContainers = [...containers];
                    if (targetContainerId === 'unsorted' && !newContainers.find(c => c.id === 'unsorted')) {
                        newContainers.push({ id: 'unsorted', name: '未存放', location: '待整理', items: [] });
                    }
                    newContainers = newContainers.map(c => c.id === targetContainerId ? { ...c, items: [...c.items, newItem] } : c);
                    setContainers(newContainers);

                    if (selectedContainer && selectedContainer.id === targetContainerId) {
                        setSelectedContainer(prev => ({ ...prev, items: [...prev.items, newItem] }));
                    }
                }
                setShowItemForm(false);
                setEditingItemData(null);
            };

            const updateItemFields = (containerId, itemId, patch) => {
                setContainers(prev => prev.map(c => {
                    if (c.id === containerId) {
                        return { ...c, items: c.items.map(i => i.id === itemId ? { ...i, ...patch } : i) };
                    }
                    return c;
                }));
                if (selectedContainer && selectedContainer.id === containerId) {
                    setSelectedContainer(prev => ({ ...prev, items: prev.items.map(i => i.id === itemId ? { ...i, ...patch } : i) }));
                }
                if (viewingItemData && viewingItemData.id === itemId) {
                    setViewingItemData(prev => ({ ...prev, ...patch }));
                }
            };

            const addShoppingExtra = (entry) => {
                if (!entry || !entry.name || !entry.name.trim()) return;
                setShoppingExtra(prev => [...prev, { id: Date.now().toString(), name: entry.name.trim(), price: entry.price || '', image: entry.image || null, source: entry.source || '手動新增' }]);
            };

            const removeShoppingExtra = (id) => {
                setShoppingExtra(prev => prev.filter(e => e.id !== id));
            };

            const markShoppingExtraPurchased = (entry) => {
                setShoppingExtra(prev => prev.filter(e => e.id !== entry.id));
                const newItem = { id: Date.now().toString(), name: entry.name, categories: ['misc'], category: 'misc', notes: '', details: '', image: entry.image || null, price: entry.price || '', hasExpiry: false, purchaseDate: '', expiryDate: '', isFavorite: false, supplementaryImages: [], quantity: 1, isConsumable: false };
                setContainers(prev => {
                    if (!prev.find(c => c.id === 'unsorted')) {
                        prev = [...prev, { id: 'unsorted', name: '未存放', location: '待整理', items: [] }];
                    }
                    return prev.map(c => c.id === 'unsorted' ? { ...c, items: [...c.items, newItem] } : c);
                });
            };

            const markRestockPurchased = (containerId, itemId) => {
                updateItemFields(containerId, itemId, { needsRestock: false, consumableStartDate: new Date().toISOString().slice(0,10) });
            };

            const createPackingList = (name) => {
                if (!name || !name.trim()) return;
                const id = Date.now().toString();
                setPackingLists(prev => [...prev, { id, name: name.trim(), items: [] }]);
                return id;
            };

            const deletePackingList = (id) => {
                setPackingLists(prev => prev.filter(l => l.id !== id));
                if (activePackingListId === id) setActivePackingListId(null);
            };

            const addItemToPackingList = (listId, entry) => {
                setPackingLists(prev => prev.map(l => l.id === listId ? { ...l, items: [...l.items, entry] } : l));
            };

            const removeItemFromPackingList = (listId, itemId) => {
                setPackingLists(prev => prev.map(l => l.id === listId ? { ...l, items: l.items.filter(i => i.id !== itemId) } : l));
            };

            const toggleFavorite = (containerId, itemId) => {
                setContainers(prev => prev.map(c => {
                    if (c.id === containerId) {
                        return { ...c, items: c.items.map(i => i.id === itemId ? { ...i, isFavorite: !i.isFavorite } : i) };
                    }
                    return c;
                }));
                if (selectedContainer && selectedContainer.id === containerId) {
                     setSelectedContainer(prev => ({ ...prev, items: prev.items.map(i => i.id === itemId ? { ...i, isFavorite: !i.isFavorite } : i) }));
                }
                if (viewingItemData && viewingItemData.id === itemId) {
                    setViewingItemData(prev => ({ ...prev, isFavorite: !prev.isFavorite }));
                }
            };

            const handleAddCategory = (name, iconName) => {
                const id = 'cat_' + Date.now();
                setCategories(prev => ({ ...prev, [id]: { id, label: name, iconName: iconName || 'Tag' } }));
                return id;
            };

            const handleUpdateCategory = (id, patch) => {
                setCategories(prev => ({ ...prev, [id]: { ...prev[id], ...patch } }));
            };

            const handleDeleteCategory = (id) => {
                const cat = categories[id];
                if (!cat) return;
                const remainingIds = Object.keys(categories).filter(cid => cid !== id);
                const fallbackId = remainingIds.includes('misc') ? 'misc' : (remainingIds[0] || null);
                if (!confirm(`刪除「${cat.label}」這個分類嗎？裡面的物品會改成「${fallbackId ? categories[fallbackId].label : '未分類'}」。`)) return;
                setContainers(prev => prev.map(c => ({
                    ...c,
                    items: c.items.map(i => {
                        const cats = (i.categories || [i.category]).filter(cid => cid !== id);
                        const nextCats = cats.length > 0 ? cats : (fallbackId ? [fallbackId] : []);
                        return { ...i, categories: nextCats, category: nextCats[0] || fallbackId };
                    })
                })));
                setCategories(prev => {
                    const next = { ...prev };
                    delete next[id];
                    return next;
                });
                if (activeCategory === id) setActiveCategory(null);
            };

            const handleDeleteContainer = (id) => {
                const removedContainer = containers.find(c => c.id === id);
                const removedIndex = containers.findIndex(c => c.id === id);
                setContainers(prev => prev.filter(c => c.id !== id));
                setSelectedContainer(null);
                if (removedContainer) {
                    showUndoToast(`已刪除「${removedContainer.name}」（含${removedContainer.items.length}件物品）`, () => {
                        setContainers(prev => {
                            const next = [...prev];
                            next.splice(Math.min(removedIndex, next.length), 0, removedContainer);
                            return next;
                        });
                    });
                }
            };

            const searchResults = useMemo(() => {
                if (!searchTerm.trim()) return [];
                const term = searchTerm.toLowerCase().trim();
                const results = [];
                containers.forEach(container => {
                    container.items.forEach(item => {
                        const catLabel = categories[item.category]?.label || '';
                        if (item.name.toLowerCase().includes(term) || item.notes?.toLowerCase().includes(term) || catLabel.includes(term)) {
                            results.push({ type: 'item', data: { ...item, containerId: container.id, containerName: container.id === 'unsorted' ? '未存放' : container.name } });
                        }
                    });
                    if (container.id !== 'unsorted' && (container.name.toLowerCase().includes(term) || container.location.toLowerCase().includes(term))) {
                        results.push({ type: 'container', data: container });
                    }
                });
                return results;
            }, [searchTerm, containers, categories]);

            // Views

            const HomeView = () => {
                const catStats = useMemo(() => {
                    const stats = {};
                    containers.forEach(c => c.items.forEach(i => { if (!stats[i.category]) stats[i.category] = { count: 0, items: [] }; stats[i.category].count++; stats[i.category].items.push({ ...i, containerName: c.id === 'unsorted' ? '未存放' : c.name, containerId: c.id }); }));
                    return stats;
                }, [containers]);
                const unsortedItems = containers.find(c => c.id === 'unsorted')?.items || [];
                const [draggedCatId, setDraggedCatId] = useState(null);
                const [editingCatId, setEditingCatId] = useState(null);
                const [catEditMode, setCatEditMode] = useState(false);
                const [editCatName, setEditCatName] = useState('');
                const [editCatIcon, setEditCatIcon] = useState('');

                return (
                <div className="space-y-4 px-4 pt-6 pb-24">
                    <div className="flex justify-between items-end px-1 mb-2">
                        <div className="flex items-center gap-3">
                            <button onClick={() => { setEditingItemData(null); setShowItemForm(true); }} className="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center shadow-md active:scale-95"><Icon name="Plus" size={20} /></button>
                            <div><h2 className="text-3xl font-extrabold text-gray-800">收納管家</h2><p className="text-gray-400 text-sm mt-1">{containers.filter(c => c.id !== 'unsorted').length} 個容器 · {containers.reduce((acc, c) => acc + c.items.length, 0)} 件物品</p></div>
                        </div>
                    </div>
                    <div className="flex justify-between items-center">
                        <button onClick={() => setActiveCategory('unsorted_view')} className="bg-indigo-50 text-indigo-700 pl-3 pr-2 py-1.5 rounded-full text-xs font-bold flex items-center gap-1.5 border border-indigo-100 active:scale-95 transition-transform">
                            <Icon name="Box" size={13}/> 未存放物品
                            <span className="bg-white text-indigo-600 px-1.5 py-0.5 rounded-full text-[10px]">{unsortedItems.length}</span>
                        </button>
                        <div className="bg-gray-100 rounded-full p-1 flex gap-1">
                            <button onClick={() => setBrowseMode('container')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition-colors ${browseMode === 'container' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-500'}`}>容器</button>
                            <button onClick={() => setBrowseMode('category')} className={`px-3 py-1.5 rounded-full text-xs font-bold transition-colors ${browseMode === 'category' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-500'}`}>分類</button>
                        </div>
                    </div>

                    {browseMode === 'container' ? (
                        <div className="space-y-2.5">
                            {containers.filter(c => c.id !== 'unsorted').map(container => (
                                <div key={container.id} onClick={() => setSelectedContainer(container)} className="bg-white rounded-xl shadow-sm border border-gray-100 flex items-center gap-3 p-2.5 cursor-pointer active:scale-[0.98] transition-transform">
                                    <div className="w-14 h-14 rounded-lg bg-gray-100 flex-shrink-0 overflow-hidden">
                                        {container.image ? <img src={container.image} className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center opacity-30"><Icon name="Box" size={24} className="text-gray-400" /></div>}
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <h3 className="font-bold text-gray-800 text-sm truncate">{container.name}</h3>
                                        <div className="text-xs text-gray-400 mt-0.5 flex items-center gap-1 truncate"><Icon name="MapPin" size={10} className="text-indigo-400 flex-shrink-0" /><span className="truncate">{container.location}</span></div>
                                    </div>
                                    <div className="text-xs font-bold text-gray-400 flex-shrink-0">{container.items.length} 件</div>
                                    <Icon name="ChevronRight" size={16} className="text-gray-300 flex-shrink-0"/>
                                </div>
                            ))}
                            <button onClick={() => setShowAddContainer(true)} className="w-full rounded-xl border-2 border-dashed border-gray-200 flex items-center justify-center gap-2 text-gray-400 hover:bg-gray-50 hover:border-gray-300 transition-colors py-3.5">
                                <Icon name="Plus" size={18} className="text-gray-500"/><span className="text-sm font-bold">新增容器</span>
                            </button>
                        </div>
                    ) : (
                        <>
                        <div className="flex justify-between items-center">
                            <p className="text-xs text-gray-400 ml-1">長按並拖動可調整分類順序</p>
                            <button onClick={() => setCatEditMode(v => !v)} className={`text-xs font-bold px-2.5 py-1 rounded-full ${catEditMode ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-500'}`}>{catEditMode ? '完成' : '編輯'}</button>
                        </div>
                        <div className="space-y-2.5">
                            {Object.values(categories).map(cat => (
                                editingCatId === cat.id ? (
                                    <div key={cat.id} className="bg-indigo-50 rounded-xl border border-indigo-200 p-3 space-y-2">
                                        <div className="flex gap-2">
                                            <input value={editCatName} onChange={e => setEditCatName(e.target.value)} className="flex-1 border border-indigo-200 rounded-lg p-2 text-sm bg-white outline-none" />
                                            <button onClick={() => handleDeleteCategory(cat.id)} className="p-2 text-red-500 bg-white rounded-lg border border-red-100"><Icon name="Trash2" size={16}/></button>
                                        </div>
                                        <div className="grid grid-cols-6 gap-2 max-h-40 overflow-y-auto no-scrollbar py-1">
                                            {AVAILABLE_ICONS.map(icon => (
                                                <button key={icon.name} onClick={() => setEditCatIcon(icon.name)} className={`aspect-square rounded-lg border flex items-center justify-center ${editCatIcon === icon.name ? 'bg-indigo-100 border-indigo-400 text-indigo-700' : 'bg-white border-gray-200 text-gray-500'}`} title={icon.label}><Icon name={icon.name} size={20}/></button>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setEditingCatId(null)} className="flex-1 py-2 bg-white border border-gray-200 rounded-lg text-sm font-bold text-gray-600">取消</button>
                                            <button onClick={() => { handleUpdateCategory(cat.id, { label: editCatName, iconName: editCatIcon }); setEditingCatId(null); }} disabled={!editCatName} className="flex-1 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold disabled:opacity-50">儲存</button>
                                        </div>
                                    </div>
                                ) : (
                                <div
                                    key={cat.id}
                                    draggable
                                    onDragStart={(e) => { setDraggedCatId(cat.id); e.dataTransfer.effectAllowed = 'move'; }}
                                    onDragOver={(e) => e.preventDefault()}
                                    onDrop={(e) => {
                                        e.preventDefault();
                                        if (!draggedCatId || draggedCatId === cat.id) return;
                                        const ids = Object.keys(categories);
                                        const fromIdx = ids.indexOf(draggedCatId);
                                        const toIdx = ids.indexOf(cat.id);
                                        if (fromIdx === -1 || toIdx === -1) return;
                                        ids.splice(toIdx, 0, ids.splice(fromIdx, 1)[0]);
                                        const reordered = {};
                                        ids.forEach(id => { reordered[id] = categories[id]; });
                                        setCategories(reordered);
                                        setDraggedCatId(null);
                                    }}
                                    onDragEnd={() => setDraggedCatId(null)}
                                    onClick={() => setActiveCategory(cat.id)}
                                    className={`bg-white rounded-xl border flex items-center gap-3 p-2.5 cursor-pointer active:scale-[0.98] transition-transform shadow-sm ${draggedCatId === cat.id ? 'opacity-40 border-indigo-300' : 'border-gray-100'}`}
                                >
                                    <div className="bg-gray-50 w-11 h-11 rounded-lg flex items-center justify-center text-gray-500 flex-shrink-0"><Icon name={cat.iconName} size={20} /></div>
                                    <span className="font-bold text-gray-700 flex-1 truncate">{cat.label}</span>
                                    <span className="text-xs font-bold text-gray-400 flex-shrink-0">{catStats[cat.id]?.count || 0} 件</span>
                                    {catEditMode && <button onClick={(e) => { e.stopPropagation(); setEditingCatId(cat.id); setEditCatName(cat.label); setEditCatIcon(cat.iconName); }} className="p-1.5 text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg flex-shrink-0"><Icon name="Pencil" size={15}/></button>}
                                    <Icon name="ChevronRight" size={16} className="text-gray-300 flex-shrink-0"/>
                                </div>
                                )
                            ))}
                        </div>
                        </>
                    )}
                </div>
                );
            };

            const SearchView = () => (
                <div className="space-y-4 px-4 pt-6 pb-24 h-full flex flex-col">
                    <div className="relative flex-shrink-0">
                        <Icon name="Search" className="absolute left-4 top-3.5 text-gray-400" size={20} />
                        <input type="text" placeholder="搜尋名稱、備註或分類" autoFocus className="w-full pl-12 pr-4 py-3 bg-white border border-gray-200 shadow-sm rounded-2xl text-lg outline-none focus:ring-2 focus:ring-indigo-500" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                        {searchTerm && <button onClick={() => setSearchTerm('')} className="absolute right-4 top-3.5 text-gray-400"><Icon name="X" size={20}/></button>}
                    </div>
                    <div className="flex-1 overflow-y-auto space-y-2 no-scrollbar">
                        {!searchTerm && <div className="text-center py-20 opacity-40"><Icon name="Filter" className="mx-auto mb-4 text-gray-300" size={64} /><p className="text-gray-500 font-medium">輸入關鍵字開始尋找</p></div>}
                        {searchResults.map((res, idx) => {
                            if(res.type === 'item') return <ItemRow key={idx} item={res.data} containerName={res.data.containerName} categories={categories} onClick={() => setViewingItemData(res.data)} onToggleFavorite={toggleFavorite} />;
                            else return (
                                <div key={idx} onClick={() => setSelectedContainer(res.data)} className="bg-white p-3 rounded-xl border border-gray-100 flex gap-3 items-center cursor-pointer active:bg-gray-50">
                                    <div className="w-10 h-10 rounded-lg bg-indigo-50 flex-shrink-0 flex items-center justify-center"><Icon name="Box" size={16} className="text-indigo-500"/></div>
                                    <div><div className="font-bold text-gray-800">{res.data.name}</div><div className="text-xs text-gray-500">容器</div></div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            const CategoryDetailView = () => {
                const catStats = useMemo(() => {
                    const stats = {};
                    containers.forEach(c => c.items.forEach(i => { if (!stats[i.category]) stats[i.category] = { count: 0, items: [] }; stats[i.category].count++; stats[i.category].items.push({ ...i, containerName: c.id === 'unsorted' ? '未存放' : c.name, containerId: c.id }); }));
                    return stats;
                }, [containers]);
                const unsortedItems = containers.find(c => c.id === 'unsorted')?.items || [];

                if (activeCategory === 'unsorted_view') {
                     const items = unsortedItems;
                     const sortedItems = [...items].sort((a, b) => (b.isFavorite === true) - (a.isFavorite === true));
                     return (
                        <div className="h-full flex flex-col">
                            <div className="sticky top-0 bg-white/80 backdrop-blur-md px-4 py-3 flex items-center gap-3 border-b border-gray-100 z-10">
                                <button onClick={() => setActiveCategory(null)} className="p-2 -ml-2 hover:bg-gray-100 rounded-full"><Icon name="ArrowLeft" size={20}/></button>
                                <span className="font-bold text-lg">📦 未存放物品</span>
                                <span className="text-xs bg-gray-100 px-2 py-1 rounded-full text-gray-500">{items.length}</span>
                            </div>
                            <div className="p-4 space-y-3 pb-24 overflow-y-auto no-scrollbar">
                                {sortedItems.map((item) => <ItemRow key={item.id} item={item} containerName={null} categories={categories} onClick={() => setViewingItemData({...item, containerId: 'unsorted'})} showTimeLabel={item.hasExpiry} onToggleFavorite={toggleFavorite} />)}
                                {items.length === 0 && <div className="text-center py-10 text-gray-400">太棒了，所有物品都已歸位！</div>}
                            </div>
                        </div>
                     )
                }

                const cat = categories[activeCategory];
                const items = catStats[activeCategory]?.items || [];
                const sortedItems = [...items].sort((a, b) => (b.isFavorite === true) - (a.isFavorite === true));
                return (
                    <div className="h-full flex flex-col">
                        <div className="sticky top-0 bg-white/80 backdrop-blur-md px-4 py-3 flex items-center gap-3 border-b border-gray-100 z-10">
                            <button onClick={() => setActiveCategory(null)} className="p-2 -ml-2 hover:bg-gray-100 rounded-full"><Icon name="ArrowLeft" size={20}/></button>
                            <span className="font-bold text-lg">{cat?.label}</span>
                            <span className="text-xs bg-gray-100 px-2 py-1 rounded-full text-gray-500">{items.length}</span>
                        </div>
                        <div className="p-4 space-y-3 pb-24 overflow-y-auto no-scrollbar">
                            {sortedItems.map((item) => <ItemRow key={item.id} item={item} containerName={item.containerName} categories={categories} onClick={() => setViewingItemData(item)} showTimeLabel={item.hasExpiry} onToggleFavorite={toggleFavorite} />)}
                            {items.length === 0 && <div className="text-center py-10 text-gray-400">無物品</div>}
                        </div>
                    </div>
                );
            };

            const ReminderView = () => {
                let timedItems = [];
                containers.forEach(c => c.items.forEach(i => { if (i.hasExpiry && i.expiryDate) timedItems.push({ ...i, containerName: c.id === 'unsorted' ? '未存放' : c.name, containerId: c.id, daysLeft: getDaysRemaining(i.expiryDate) }); }));
                const expiredItems = timedItems.filter(i => i.daysLeft < 0);
                const activeItems = timedItems.filter(i => i.daysLeft >= 0);
                activeItems.sort((a, b) => a.daysLeft - b.daysLeft);
                expiredItems.sort((a, b) => a.daysLeft - b.daysLeft);

                let restockItems = [];
                containers.forEach(c => c.items.forEach(i => {
                    if (!i.isConsumable) return;
                    const daysLeft = (i.consumableDurationDays && i.consumableStartDate) ? (Number(i.consumableDurationDays) - Math.floor((new Date().setHours(0,0,0,0) - new Date(i.consumableStartDate).setHours(0,0,0,0)) / 86400000)) : null;
                    if (i.needsRestock || (daysLeft !== null && daysLeft <= 7)) {
                        restockItems.push({ ...i, containerId: c.id, containerName: c.id === 'unsorted' ? '未存放' : c.name, daysLeft });
                    }
                }));

                const [newName, setNewName] = useState('');
                const [newPrice, setNewPrice] = useState('');
                const [newImage, setNewImage] = useState(null);

                if (showExpiredView) {
                    return (
                        <div className="h-full flex flex-col">
                            <div className="sticky top-0 bg-white/80 backdrop-blur-md px-4 py-3 flex items-center gap-3 border-b border-gray-100 z-10">
                                <button onClick={() => setShowExpiredView(false)} className="p-2 -ml-2 hover:bg-gray-100 rounded-full"><Icon name="ArrowLeft" size={20}/></button>
                                <span className="font-bold text-lg text-red-600">已過期物品</span>
                                <span className="text-xs bg-red-100 text-red-600 px-2 py-1 rounded-full">{expiredItems.length}</span>
                            </div>
                            <div className="p-4 space-y-3 pb-24 overflow-y-auto no-scrollbar">
                                {expiredItems.map((item) => (
                                    <ItemRow key={item.id} item={item} containerName={item.containerName} categories={categories} onClick={() => setViewingItemData(item)} showTimeLabel={true} onToggleFavorite={toggleFavorite} />
                                ))}
                                {expiredItems.length === 0 && <div className="text-center py-10 text-gray-400">暫無過期物品</div>}
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="h-full flex flex-col">
                        <div className="sticky top-0 bg-white/80 backdrop-blur-md px-4 pt-4 pb-3 border-b border-gray-100 z-10">
                            <div className="flex justify-between items-center mb-3">
                                <h2 className="text-2xl font-bold text-gray-800">提醒</h2>
                                {reminderSubView === 'time' && (
                                    <button onClick={() => setShowExpiredView(true)} className="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 border border-red-100 relative">
                                        已過期
                                        {expiredItems.length > 0 && <span className="absolute -top-1.5 -right-1.5 bg-red-600 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full border border-white">{expiredItems.length}</span>}
                                    </button>
                                )}
                            </div>
                            <div className="bg-gray-100 rounded-full p-1 flex gap-1">
                                <button onClick={() => setReminderSubView('time')} className={`flex-1 px-3 py-1.5 rounded-full text-xs font-bold transition-colors ${reminderSubView === 'time' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-500'}`}>時效提醒</button>
                                <button onClick={() => setReminderSubView('shopping')} className={`flex-1 px-3 py-1.5 rounded-full text-xs font-bold transition-colors ${reminderSubView === 'shopping' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-500'}`}>採購清單</button>
                            </div>
                        </div>

                        {reminderSubView === 'time' ? (
                            <div className="p-4 space-y-3 pb-24 overflow-y-auto no-scrollbar flex-1">
                                {activeItems.map((item) => (
                                    <ItemRow key={item.id} item={item} containerName={item.containerName} categories={categories} onClick={() => setViewingItemData(item)} showTimeLabel={true} onToggleFavorite={toggleFavorite} />
                                ))}
                                {activeItems.length === 0 && <div className="text-center py-10 text-gray-400">沒有即將到期的物品</div>}
                            </div>
                        ) : (
                            <div className="p-4 space-y-6 pb-24 overflow-y-auto no-scrollbar flex-1">
                                {/* 新需要買的 */}
                                <div className="bg-emerald-50 border border-emerald-100 rounded-2xl p-4">
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="font-bold text-emerald-800 flex items-center gap-1"><Icon name="ShoppingBag" size={16}/> 需要買</h3>
                                        <button onClick={() => setShowShoppingNewForm(v => !v)} className="w-7 h-7 rounded-full bg-emerald-600 text-white flex items-center justify-center"><Icon name={showShoppingNewForm ? 'X' : 'Plus'} size={14}/></button>
                                    </div>
                                    {showShoppingNewForm && (
                                        <div className="bg-white p-3 rounded-xl border border-emerald-200 mb-3 space-y-2">
                                            <div className="flex gap-3">
                                                <ImageUploader image={newImage} onImageChange={setNewImage} compact={true} />
                                                <div className="flex-1 space-y-2">
                                                    <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="名稱" className="w-full border border-gray-200 rounded-lg p-2 text-sm outline-none" />
                                                    <div className="relative">
                                                        <Icon name="DollarSign" size={14} className="absolute left-2.5 top-2.5 text-gray-400"/>
                                                        <input type="number" value={newPrice} onChange={e => setNewPrice(e.target.value)} placeholder="價格" className="w-full border border-gray-200 rounded-lg p-2 pl-7 text-sm outline-none" />
                                                    </div>
                                                </div>
                                            </div>
                                            <button onClick={() => {
                                                if (!newName.trim()) return;
                                                addShoppingExtra({ name: newName, price: newPrice, image: newImage, source: '手動新增' });
                                                setNewName(''); setNewPrice(''); setNewImage(null); setShowShoppingNewForm(false);
                                            }} className="w-full bg-emerald-600 text-white py-2 rounded-lg text-sm font-bold">加入清單</button>
                                        </div>
                                    )}
                                    <div className="space-y-2">
                                        {shoppingExtra.map(entry => (
                                            <div key={entry.id} className="bg-white p-3 rounded-xl border border-emerald-100 flex items-center gap-3">
                                                <button onClick={() => markShoppingExtraPurchased(entry)} className="w-6 h-6 rounded-full border-2 border-emerald-300 flex-shrink-0 active:bg-emerald-100"></button>
                                                {entry.image && <img src={entry.image} className="w-8 h-8 rounded-lg object-cover flex-shrink-0"/>}
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-bold text-gray-800 text-sm truncate">{entry.name}{entry.price ? `　$${entry.price}` : ''}</div>
                                                    <div className="text-[10px] text-gray-400">{entry.source}</div>
                                                </div>
                                                <button onClick={() => removeShoppingExtra(entry.id)} className="p-1 text-gray-300 hover:text-red-500"><Icon name="X" size={16}/></button>
                                            </div>
                                        ))}
                                        {shoppingExtra.length === 0 && <div className="text-center py-4 text-emerald-700/50 text-xs">目前沒有要買的</div>}
                                    </div>
                                </div>

                                {/* 補貨 */}
                                <div className="bg-amber-50 border border-amber-100 rounded-2xl p-4">
                                    <h3 className="font-bold text-amber-800 mb-3 flex items-center gap-1"><Icon name="RefreshCw" size={16}/> 補貨（消耗品）</h3>
                                    <div className="space-y-2">
                                        {restockItems.map(item => (
                                            <div key={item.id} className="bg-white p-3 rounded-xl border border-amber-100 flex items-center gap-3">
                                                <button onClick={() => markRestockPurchased(item.containerId, item.id)} className="w-6 h-6 rounded-full border-2 border-amber-300 flex-shrink-0 active:bg-amber-100"></button>
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-bold text-gray-800 text-sm truncate">{item.name}</div>
                                                    <div className="text-[10px] text-gray-400">{item.daysLeft !== null ? (item.daysLeft < 0 ? '預估已用完' : `預估還可用 ${item.daysLeft} 天`) : '手動標記需要補貨'}</div>
                                                </div>
                                                <button onClick={() => { setEditingItemData({ ...item }); setShowItemForm(true); }} className="p-1.5 text-amber-600 hover:bg-amber-100 rounded-lg"><Icon name="Edit3" size={16}/></button>
                                            </div>
                                        ))}
                                        {restockItems.length === 0 && <div className="text-center py-4 text-amber-700/50 text-xs">目前沒有快用完的消耗品</div>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const MoreView = () => (
                <div className="px-4 pt-6 pb-24 h-full overflow-y-auto no-scrollbar">
                    <h2 className="text-2xl font-bold text-gray-800 mb-6">更多</h2>
                    <div className="space-y-3">
                        <button onClick={() => setShowSettings(true)} className="w-full bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center gap-3 active:bg-gray-50">
                            <div className="bg-gray-100 p-2.5 rounded-full text-gray-600"><Icon name="Settings" size={20}/></div>
                            <span className="font-bold text-gray-800 flex-1 text-left">設定</span>
                            <Icon name="ChevronRight" size={18} className="text-gray-300"/>
                        </button>
                    </div>
                </div>
            );

            const ListsView = () => {
                const [newListName, setNewListName] = useState('');
                const [newCustomText, setNewCustomText] = useState('');

                const favItems = [];
                containers.forEach(c => c.items.forEach(i => { if (i.isFavorite) favItems.push({ ...i, containerName: c.id === 'unsorted' ? '未存放' : c.name, containerId: c.id }); }));

                const activeList = packingLists.find(l => l.id === activePackingListId);

                if (listsSubView === 'packing' && activeList) {
                    return (
                        <div className="h-full flex flex-col">
                            <div className="sticky top-0 bg-white/80 backdrop-blur-md px-4 py-3 flex items-center justify-between gap-3 border-b border-gray-100 z-10">
                                <div className="flex items-center gap-2 overflow-hidden">
                                    <button onClick={() => setActivePackingListId(null)} className="p-2 -ml-2 hover:bg-gray-100 rounded-full"><Icon name="ArrowLeft" size={20}/></button>
                                    <span className="font-bold text-lg truncate">{activeList.name}</span>
                                </div>
                                <button onClick={() => { deletePackingList(activeList.id); }} className="p-2 -mr-2 text-gray-400 hover:text-red-500 rounded-full hover:bg-red-50"><Icon name="Trash2" size={18} /></button>
                            </div>
                            <div className="p-4 space-y-2 pb-32 overflow-y-auto no-scrollbar flex-1">
                                {activeList.items.map(entry => (
                                    <div key={entry.id} className="bg-white p-3 rounded-xl border border-gray-100 flex items-center gap-3 shadow-sm">
                                        <div className={`w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 ${entry.type === 'inventory' ? 'bg-indigo-50 text-indigo-500' : 'bg-gray-100 text-gray-400'}`}>
                                            <Icon name={entry.type === 'inventory' ? 'Box' : 'Tag'} size={16}/>
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <div className="font-bold text-gray-800 text-sm truncate">{entry.name}</div>
                                            {entry.type === 'inventory' ? (
                                                <div className="text-[10px] text-gray-400">放在：{entry.containerName}</div>
                                            ) : (
                                                <div className="text-[10px] text-emerald-600">已加入採購清單</div>
                                            )}
                                        </div>
                                        <button onClick={() => removeItemFromPackingList(activeList.id, entry.id)} className="p-1 text-gray-300 hover:text-red-500"><Icon name="X" size={16}/></button>
                                    </div>
                                ))}
                                {activeList.items.length === 0 && <div className="text-center py-10 text-gray-400 text-sm">這份清單還是空的</div>}
                            </div>
                            <div className="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-white via-white to-transparent md:max-w-md md:mx-auto space-y-2">
                                {showPackingCustomInput && (
                                    <div className="flex gap-2 bg-white p-2 rounded-xl border border-gray-200 shadow-lg">
                                        <input value={newCustomText} onChange={e => setNewCustomText(e.target.value)} autoFocus placeholder="要買/要帶的東西" className="flex-1 p-2 text-sm outline-none" />
                                        <button onClick={() => {
                                            if (!newCustomText.trim()) return;
                                            addItemToPackingList(activeList.id, { id: Date.now().toString(), type: 'custom', name: newCustomText.trim() });
                                            addShoppingExtra({ name: newCustomText.trim(), source: `打包清單：${activeList.name}` });
                                            showInfoToast('已同步到採購清單');
                                            setNewCustomText(''); setShowPackingCustomInput(false);
                                        }} className="bg-indigo-600 text-white px-3 rounded-lg text-sm font-bold">加入</button>
                                    </div>
                                )}
                                <div className="flex gap-2">
                                    <button onClick={() => setShowItemPicker(true)} className="flex-1 bg-white border border-gray-200 text-gray-700 py-3 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 text-sm"><Icon name="Box" size={16}/> 從庫存選擇</button>
                                    <button onClick={() => setShowPackingCustomInput(v => !v)} className="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 text-sm"><Icon name="Plus" size={16}/> 新增購買</button>
                                </div>
                            </div>
                            {showItemPicker && (
                                <ItemPickerModal
                                    containers={containers}
                                    categories={categories}
                                    onClose={() => setShowItemPicker(false)}
                                    onSelect={(item) => {
                                        addItemToPackingList(activeList.id, { id: Date.now().toString(), type: 'inventory', name: item.name, itemId: item.id, containerId: item.containerId, containerName: item.containerName });
                                        setShowItemPicker(false);
                                    }}
                                />
                            )}
                        </div>
                    );
                }

                return (
                    <div className="h-full flex flex-col">
                        <div className="sticky top-0 bg-white/80 backdrop-blur-md px-4 pt-4 pb-3 border-b border-gray-100 z-10">
                            <div className="flex justify-between items-center mb-3">
                                <h2 className="text-2xl font-bold text-gray-800">清單</h2>
                                {listsSubView === 'packing' && (
                                    <button onClick={() => setShowPackingNewListForm(v => !v)} className="w-9 h-9 rounded-full bg-indigo-600 text-white flex items-center justify-center shadow-md active:scale-95"><Icon name="Plus" size={18} /></button>
                                )}
                            </div>
                            <div className="bg-gray-100 rounded-full p-1 flex gap-1">
                                <button onClick={() => setListsSubView('favorites')} className={`flex-1 px-3 py-1.5 rounded-full text-xs font-bold transition-colors ${listsSubView === 'favorites' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-500'}`}>收藏</button>
                                <button onClick={() => setListsSubView('packing')} className={`flex-1 px-3 py-1.5 rounded-full text-xs font-bold transition-colors ${listsSubView === 'packing' ? 'bg-white shadow-sm text-indigo-600' : 'text-gray-500'}`}>打包清單</button>
                            </div>
                        </div>

                        {listsSubView === 'favorites' ? (
                            <div className="p-4 space-y-3 pb-24 overflow-y-auto no-scrollbar flex-1">
                                {favItems.map((item) => (
                                    <ItemRow key={item.id} item={item} containerName={item.containerName} categories={categories} onClick={() => setViewingItemData(item)} onToggleFavorite={toggleFavorite} />
                                ))}
                                {favItems.length === 0 && <div className="text-center py-20 text-gray-400">還沒有收藏任何物品</div>}
                            </div>
                        ) : (
                            <div className="p-4 pb-24 overflow-y-auto no-scrollbar flex-1">
                                {showPackingNewListForm && (
                                    <div className="mb-4 p-3 bg-indigo-50 rounded-xl border border-indigo-100 flex gap-2">
                                        <input value={newListName} onChange={e => setNewListName(e.target.value)} autoFocus placeholder="例：露營、爬山、手工材料" className="flex-1 p-2 border border-indigo-200 rounded-lg text-sm bg-white outline-none" />
                                        <button onClick={() => { if (newListName.trim()) { createPackingList(newListName); setNewListName(''); setShowPackingNewListForm(false); } }} className="bg-indigo-600 text-white px-3 rounded-lg text-sm font-bold">建立</button>
                                    </div>
                                )}
                                <div className="space-y-2.5">
                                    {packingLists.map(list => (
                                        <div key={list.id} onClick={() => setActivePackingListId(list.id)} className="bg-white p-3 rounded-xl border border-gray-100 shadow-sm flex items-center gap-3 cursor-pointer active:bg-gray-50">
                                            <div className="bg-indigo-50 p-2.5 rounded-full text-indigo-600"><Icon name="Backpack" size={20}/></div>
                                            <div className="flex-1"><div className="font-bold text-gray-800">{list.name}</div><div className="text-xs text-gray-400">{list.items.length} 項物品</div></div>
                                            <Icon name="ChevronRight" size={18} className="text-gray-300"/>
                                        </div>
                                    ))}
                                    {packingLists.length === 0 && <div className="text-center py-20 text-gray-400 text-sm">還沒有打包清單，點右上角＋建立一份</div>}
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="bg-gray-50 min-h-screen font-sans text-gray-900 md:max-w-md md:mx-auto shadow-2xl relative overflow-hidden flex flex-col">
                    <main className={`flex-1 overflow-hidden ${selectedContainer ? 'p-0' : ''}`}>
                        {selectedContainer ? <ContainerDetail selectedContainer={selectedContainer} categories={categories} setSelectedContainer={setSelectedContainer} setShowEditContainer={setShowEditContainer} handleDeleteContainer={handleDeleteContainer} setViewingItemData={setViewingItemData} toggleFavorite={toggleFavorite} setShowItemForm={setShowItemForm} setEditingItemData={setEditingItemData} />
                        : activeTab === 'lists' ? <ListsView />
                        : activeTab === 'find' ? <SearchView />
                        : activeTab === 'more' ? <MoreView />
                        : activeTab === 'reminder' ? <ReminderView />
                        : activeCategory ? <CategoryDetailView />
                        : <HomeView />}
                    </main>
                    {!selectedContainer && !(activeTab === 'lists' && listsSubView === 'packing' && activePackingListId) && (
                        <nav className="fixed bottom-3 left-3 right-3 bg-gray-900 rounded-full shadow-[0_10px_30px_rgba(0,0,0,0.35)] px-2 py-2 flex justify-around items-center z-40 md:max-w-md md:mx-auto h-16">
                            <button onClick={() => { setActiveTab('browse'); setActiveCategory(null); }} className={`flex flex-col items-center gap-0.5 w-12 ${activeTab === 'browse' ? 'text-indigo-300' : 'text-white/40'}`}><Icon name="Home" size={22} strokeWidth={activeTab === 'browse' ? 2.5 : 2} /></button>
                            <button onClick={() => { setActiveTab('lists'); setActiveCategory(null); }} className={`flex flex-col items-center gap-0.5 w-12 ${activeTab === 'lists' ? 'text-indigo-300' : 'text-white/40'}`}><Icon name="Star" size={22} strokeWidth={activeTab === 'lists' ? 2.5 : 2} /></button>
                            <div className="relative -top-6"><button onClick={() => setActiveTab('find')} className={`flex items-center justify-center w-16 h-16 rounded-full shadow-xl border-4 border-gray-900 transition-transform active:scale-95 ${activeTab === 'find' ? 'bg-indigo-600 text-white' : 'bg-indigo-500 text-white'}`}><Icon name="Search" size={28} strokeWidth={3} /></button></div>
                            <button onClick={() => setActiveTab('reminder')} className={`flex flex-col items-center gap-0.5 w-12 ${activeTab === 'reminder' ? 'text-indigo-300' : 'text-white/40'}`}>
                                <div className="relative">
                                    <Icon name="ShoppingCart" size={22} strokeWidth={activeTab === 'reminder' ? 2.5 : 2} />
                                    <div className="absolute -top-1 -right-1.5 w-2 h-2 rounded-full bg-rose-500"></div>
                                </div>
                            </button>
                            <button onClick={() => setActiveTab('more')} className={`flex flex-col items-center gap-0.5 w-12 ${activeTab === 'more' ? 'text-indigo-300' : 'text-white/40'}`}><Icon name="Menu" size={22} strokeWidth={activeTab === 'more' ? 2.5 : 2} /></button>
                        </nav>
                    )}
                    {showAddContainer && <ContainerFormModal onClose={() => setShowAddContainer(false)} onSave={handleSaveContainer} />}
                    {showEditContainer && selectedContainer && <ContainerFormModal initialData={selectedContainer} onClose={() => setShowEditContainer(false)} onSave={handleSaveContainer} />}
                    {showItemForm && <ItemFormModal containers={containers} categories={categories} initialData={editingItemData} preSelectedContainerId={selectedContainer?.id} onClose={() => { setShowItemForm(false); setEditingItemData(null); }} onSave={handleSaveItem} onDelete={handleDeleteItem} onAddCategory={handleAddCategory} />}
                    {viewingItemData && <ItemDetailModal item={viewingItemData} containerData={containers.find(c => c.id === viewingItemData.containerId)} categories={categories} onClose={() => setViewingItemData(null)} onEdit={() => { setEditingItemData(viewingItemData); setViewingItemData(null); setShowItemForm(true); }} onUpdateItem={(patch) => updateItemFields(viewingItemData.containerId, viewingItemData.id, patch)} />}
                    {showSettings && <SettingsModal onClose={() => setShowSettings(false)} onExport={handleExport} onImport={handleImport} />}
                    {undoToast && (
                        <div className="fixed bottom-24 left-4 right-4 md:max-w-md md:mx-auto bg-gray-900 text-white rounded-xl px-4 py-3 flex items-center justify-between gap-3 shadow-2xl z-50 animate-in fade-in duration-200">
                            <span className="text-sm truncate">{undoToast.label}</span>
                            <button onClick={handleUndo} className="text-indigo-300 font-bold text-sm flex-shrink-0">復原</button>
                        </div>
                    )}
                    {infoToast && (
                        <div className="fixed bottom-24 left-4 right-4 md:max-w-md md:mx-auto bg-emerald-600 text-white rounded-xl px-4 py-3 flex items-center gap-2 shadow-2xl z-50 animate-in fade-in duration-200">
                            <Icon name="Check" size={16}/>
                            <span className="text-sm truncate">{infoToast}</span>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        // Register service worker so the app can be installed and works offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
