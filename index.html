                    xmlns="http://www.w3.org/2000/svg"

                    viewBox="0 0 24 24"
                    fill={fill || "none"}
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"

                    {...props}

        // --- 工具函數 ---
        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 800; 
                        let width = img.width;
                        let height = img.height;
                        if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                        else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        const getDaysRemaining = (expiryDate) => {
            if (!expiryDate) return null;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const target = new Date(expiryDate);
            const diffTime = target - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        };

                        window.JsBarcode(svgRef.current, value, {
                            format: "CODE128",
                            displayValue: false,
                            width: 1.6,
                            height: 46,
                            margin: 8,
                            background: "#ffffff",
                            lineColor: "#111827",
                        });
                    } catch (e) { console.error('條碼生成失敗', e); }
                }
            }, [value]);

            const handleDownload = () => {
                const svg = svgRef.current;
                if (!svg) return;
                const svgData = new XMLSerializer().serializeToString(svg);
                const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);
                const img = new Image();
                img.onload = () => {
                    const scale = 4;
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.scale(scale, scale);
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    const pngUrl = canvas.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = pngUrl;
                    a.download = `${(name || '條碼').replace(/[^\w\u4e00-\u9fa5]/g, '')}.png`;
                    a.click();
                };
                img.src = url;
            };

            return (
                <div className="bg-white rounded-xl border border-gray-100 p-4 flex flex-col items-center gap-2 shadow-sm">
                    <svg ref={svgRef}></svg>
                    <button onClick={handleDownload} className="text-xs font-bold text-indigo-600 flex items-center gap-1"><Icon name="Download" size={12}/> 下載條碼圖片</button>
